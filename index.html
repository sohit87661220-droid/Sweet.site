<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐶 Dog Bike Dance</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  overflow:hidden;
  background:#87ceeb;
  font-family:Arial,sans-serif;
  height:100vh;
}

.scene{
  width:100%;
  height:100vh;
  position:relative;
  overflow:hidden;
  background:linear-gradient(#69d2ff 0%,#b9f3ff 65%,#75d66b 66%);
}

/* Sun */
.sun{
  position:absolute;
  width:90px;
  height:90px;
  background:#ffd93d;
  border-radius:50%;
  top:40px;
  right:35px;
  box-shadow:0 0 45px #ffd93d;
}

/* Clouds */
.cloud{
  position:absolute;
  width:120px;
  height:40px;
  background:white;
  border-radius:50px;
  opacity:.9;
  animation:cloudMove 18s linear infinite;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:white;
  border-radius:50%;
}

.cloud:before{
  width:55px;
  height:55px;
  left:20px;
  top:-25px;
}

.cloud:after{
  width:70px;
  height:70px;
  right:15px;
  top:-35px;
}

.c1{top:100px;left:-150px}
.c2{top:180px;left:-400px;animation-delay:7s}

@keyframes cloudMove{
  from{transform:translateX(0)}
  to{transform:translateX(calc(100vw + 600px))}
}

/* Road */
.road{
  position:absolute;
  bottom:0;
  height:34%;
  width:100%;
  background:#444;
}

.roadLine{
  position:absolute;
  top:48%;
  width:200%;
  height:12px;
  background:repeating-linear-gradient(
    90deg,
    #fff 0 80px,
    transparent 80px 160px
  );
  animation:road 1s linear infinite;
}

@keyframes road{
  from{transform:translateX(0)}
  to{transform:translateX(-160px)}
}

/* Bike */
.bike{
  position:absolute;
  left:50%;
  bottom:23%;
  width:280px;
  height:160px;
  transform:translateX(-50%);
  animation:bounce .35s infinite alternate;
}

@keyframes bounce{
  from{transform:translateX(-50%) translateY(0)}
  to{transform:translateX(-50%) translateY(-7px)}
}

.wheel{
  position:absolute;
  bottom:0;
  width:78px;
  height:78px;
  border:10px solid #111;
  border-radius:50%;
  background:#777;
  animation:wheel 0.35s linear infinite;
}

.wheel:after{
  content:"";
  position:absolute;
  width:100%;
  height:5px;
  background:#ddd;
  top:50%;
  left:0;
}

.w1{left:15px}
.w2{right:15px}

@keyframes wheel{
  to{transform:rotate(360deg)}
}

.frame{
  position:absolute;
  width:160px;
  height:75px;
  left:60px;
  bottom:40px;
  border-bottom:12px solid #e63946;
  border-left:12px solid #e63946;
  transform:skew(-15deg);
}

.handle{
  position:absolute;
  right:25px;
  bottom:92px;
  width:55px;
  height:12px;
  background:#111;
  transform:rotate(-20deg);
}

/* Dogs */
.dog{
  position:absolute;
  bottom:112px;
  width:85px;
  height:100px;
  z-index:5;
  animation:dance .35s infinite alternate;
}

.dog1{left:70px}
.dog2{right:65px;animation-delay:.15s}

@keyframes dance{
  from{transform:rotate(-8deg) translateY(0)}
  to{transform:rotate(8deg) translateY(-16px)}
}

.body{
  position:absolute;
  width:58px;
  height:62px;
  background:#c98245;
  border-radius:50%;
  left:14px;
  top:35px;
}

.head{
  position:absolute;
  width:58px;
  height:55px;
  background:#d9965b;
  border-radius:50%;
  left:14px;
  top:0;
  z-index:2;
}

.ear{
  position:absolute;
  width:25px;
  height:42px;
  background:#75451f;
  border-radius:50%;
  top:5px;
}

.ear1{left:5px;transform:rotate(-25deg)}
.ear2{right:5px;transform:rotate(25deg)}

.eye{
  position:absolute;
  width:8px;
  height:10px;
  background:#111;
  border-radius:50%;
  top:22px;
}

.eye1{left:16px}
.eye2{right:16px}

.nose{
  position:absolute;
  width:13px;
  height:10px;
  background:#111;
  border-radius:50%;
  left:23px;
  top:34px;
}

.mouth{
  position:absolute;
  width:20px;
  height:10px;
  border-bottom:3px solid #111;
  border-radius:50%;
  left:19px;
  top:39px;
}

/* Arms */
.arm{
  position:absolute;
  width:42px;
  height:10px;
  background:#c98245;
  border-radius:10px;
  top:52px;
  z-index:6;
}

.armL{
  left:-18px;
  transform:rotate(-55deg);
  animation:armDance .3s infinite alternate;
}

.armR{
  right:-18px;
  transform:rotate(55deg);
  animation:armDance2 .3s infinite alternate;
}

@keyframes armDance{
  to{transform:rotate(55deg)}
}

@keyframes armDance2{
  to{transform:rotate(-55deg)}
}

/* Legs */
.leg{
  position:absolute;
  width:13px;
  height:45px;
  background:#75451f;
  top:82px;
  border-radius:10px;
}

.leg1{left:25px}
.leg2{right:25px}

/* Music button */
.musicBtn{
  position:absolute;
  top:20px;
  left:20px;
  z-index:20;
  border:0;
  padding:12px 18px;
  border-radius:30px;
  background:#111;
  color:white;
  font-size:15px;
  cursor:pointer;
  box-shadow:0 5px 15px #0005;
}

.title{
  position:absolute;
  top:75px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  color:white;
  text-align:center;
  text-shadow:2px 3px 5px #333;
}

.title h1{
  font-size:30px;
}

.title p{
  font-size:15px;
}

/* Confetti */
.confetti{
  position:absolute;
  width:9px;
  height:15px;
  top:-30px;
  animation:fall 3s linear infinite;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
  }
}
</style>
</head>

<body>

<div class="scene">

  <div class="sun"></div>

  <div class="cloud c1"></div>
  <div class="cloud c2"></div>

  <button class="musicBtn" onclick="playMusic()">
    🎵 Play Song
  </button>

  <div class="title">
    <h1>🐶 DOGGY DANCE 🐶</h1>
    <p>Bike ride + Dance Party 🏍️💃</p>
  </div>

  <!-- Bike -->
  <div class="bike">

    <div class="wheel w1"></div>
    <div class="wheel w2"></div>

    <div class="frame"></div>
    <div class="handle"></div>

    <!-- Dog 1 -->
    <div class="dog dog1">
      <div class="head">
        <div class="ear ear1"></div>
        <div class="ear ear2"></div>
        <div class="eye eye1"></div>
        <div class="eye eye2"></div>
        <div class="nose"></div>
        <div class="mouth"></div>
      </div>

      <div class="body"></div>
      <div class="arm armL"></div>
      <div class="arm armR"></div>
      <div class="leg leg1"></div>
      <div class="leg leg2"></div>
    </div>

    <!-- Dog 2 -->
    <div class="dog dog2">
      <div class="head">
        <div class="ear ear1"></div>
        <div class="ear ear2"></div>
        <div class="eye eye1"></div>
        <div class="eye eye2"></div>
        <div class="nose"></div>
        <div class="mouth"></div>
      </div>

      <div class="body"></div>
      <div class="arm armL"></div>
      <div class="arm armR"></div>
      <div class="leg leg1"></div>
      <div class="leg leg2"></div>
    </div>

  </div>

  <div class="road">
    <div class="roadLine"></div>
  </div>

</div>

<audio id="song" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
function playMusic(){

  const song=document.getElementById("song");
  const btn=document.querySelector(".musicBtn");

  if(song.paused){
    song.play();
    btn.innerHTML="🔊 Music ON";
  }else{
    song.pause();
    btn.innerHTML="🔇 Music OFF";
  }
}

/* Confetti */
for(let i=0;i<45;i++){

  let c=document.createElement("div");

  c.className="confetti";

  c.style.left=Math.random()*100+"%";
  c.style.animationDelay=Math.random()*3+"s";
  c.style.animationDuration=(2+Math.random()*3)+"s";

  document.querySelector(".scene").appendChild(c);
}
</script>

</body>
</html>
