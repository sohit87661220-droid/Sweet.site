<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise 🎂</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ffd6e7,#d9c2ff,#c5ecff);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

/* ---------- GIFT ---------- */

#start{
    z-index:10;
}

.intro{
    color:#91466f;
    font-size:21px;
    margin-bottom:25px;
    animation:pulse 1.5s infinite;
}

.gift{
    width:150px;
    height:120px;
    position:relative;
    margin:auto;
    cursor:pointer;
    animation:float 2s infinite;
}

.gift-box{
    position:absolute;
    bottom:0;
    left:15px;
    width:120px;
    height:80px;
    background:#ff6f91;
    border-radius:8px;
}

.gift-box:after{
    content:"";
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:20px;
    height:100%;
    background:#ffd166;
}

.gift-lid{
    position:absolute;
    top:25px;
    left:5px;
    width:140px;
    height:30px;
    background:#ff477e;
    border-radius:7px;
    z-index:2;
}

.gift-lid:after{
    content:"";
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:20px;
    height:30px;
    background:#ffd166;
}

.bow{
    position:absolute;
    top:-10px;
    left:50%;
    transform:translateX(-50%);
    font-size:45px;
    z-index:3;
}

.open .gift-lid{
    animation:lidOpen 1s forwards;
}

.open .bow{
    animation:bowOpen 1s forwards;
}

.open{
    animation:giftDisappear 1s forwards;
}


/* ---------- SURPRISE ---------- */

#surprise{
    display:none;
    position:absolute;
    inset:0;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.content{
    z-index:20;
}

.title{
    font-size:48px;
    color:white;
    text-shadow:0 5px 15px #d44b82;
    opacity:0;
    animation:titleShow 1s 6s forwards;
}

.name{
    font-size:30px;
    color:white;
    margin:10px;
    opacity:0;
    animation:titleShow 1s 6.5s forwards;
}


/* ---------- CAKE ---------- */

.cake-area{
    width:300px;
    height:300px;
    position:relative;
    margin:10px auto;
}

/* Plate */

.plate{
    position:absolute;
    bottom:20px;
    left:30px;
    width:240px;
    height:25px;
    background:#ffffff;
    border-radius:50%;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    opacity:0;
    animation:plateShow .7s 1s forwards;
}

/* Bottom cake */

.layer1{
    position:absolute;
    bottom:45px;
    left:55px;
    width:190px;
    height:65px;
    background:#ff9fba;
    border-radius:10px 10px 18px 18px;
    opacity:0;
    animation:layerShow 1s 1.7s forwards;
}

.layer1:before{
    content:"";
    position:absolute;
    top:-12px;
    left:0;
    width:190px;
    height:25px;
    background:#fff5fa;
    border-radius:50%;
}

/* Middle layer */

.layer2{
    position:absolute;
    bottom:105px;
    left:75px;
    width:150px;
    height:55px;
    background:#ff7fa5;
    border-radius:10px 10px 15px 15px;
    opacity:0;
    animation:layerShow 1s 2.8s forwards;
}

.layer2:before{
    content:"";
    position:absolute;
    top:-10px;
    left:0;
    width:150px;
    height:22px;
    background:#fff;
    border-radius:50%;
}

/* Top cake */

.layer3{
    position:absolute;
    bottom:155px;
    left:95px;
    width:110px;
    height:45px;
    background:#ff6f91;
    border-radius:10px 10px 14px 14px;
    opacity:0;
    animation:layerShow 1s 3.9s forwards;
}

.layer3:before{
    content:"";
    position:absolute;
    top:-10px;
    left:0;
    width:110px;
    height:20px;
    background:#fff5fa;
    border-radius:50%;
}

/* Cream drops */

.cream{
    position:absolute;
    bottom:145px;
    left:105px;
    font-size:35px;
    opacity:0;
    animation:creamShow 1s 4.6s forwards;
}

/* Candle */

.candle{
    position:absolute;
    bottom:200px;
    left:140px;
    width:18px;
    height:55px;
    background:#ffd166;
    border-radius:5px;
    opacity:0;
    animation:candleShow .7s 5s forwards;
}

/* Flame */

.flame{
    position:absolute;
    bottom:250px;
    left:137px;
    font-size:30px;
    opacity:0;
    animation:flameShow .8s 5.5s forwards,
              flame 1s 6.3s infinite alternate;
}


/* ---------- BALLOONS ---------- */

.balloon{
    position:absolute;
    bottom:-100px;
    font-size:60px;
    animation:balloonUp 7s linear forwards;
}

.b1{left:5%;animation-delay:1s;}
.b2{left:20%;animation-delay:1.5s;}
.b3{left:75%;animation-delay:1.2s;}
.b4{left:90%;animation-delay:2s;}


/* ---------- HEARTS ---------- */

.heart{
    position:absolute;
    bottom:-50px;
    font-size:25px;
    animation:heartUp 6s linear infinite;
}

.h1{left:15%;}
.h2{left:40%;animation-delay:2s;}
.h3{left:70%;animation-delay:1s;}
.h4{left:85%;animation-delay:3s;}


/* ---------- CONFETTI ---------- */

.confetti{
    position:absolute;
    top:-40px;
    font-size:25px;
    animation:confettiFall 4s linear forwards;
}


/* ---------- ANIMATIONS ---------- */

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

@keyframes lidOpen{
    to{
        transform:translateY(-90px) rotate(-10deg);
        opacity:0;
    }
}

@keyframes bowOpen{
    to{
        transform:translate(-50%,-100px);
        opacity:0;
    }
}

@keyframes giftDisappear{
    70%{transform:scale(1.15);}
    100%{transform:scale(0);opacity:0;}
}

@keyframes plateShow{
    from{
        opacity:0;
        transform:scale(0);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes layerShow{
    from{
        opacity:0;
        transform:translateY(80px) scale(.5);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes creamShow{
    from{
        opacity:0;
        transform:scale(0);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes candleShow{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes flameShow{
    from{
        opacity:0;
        transform:scale(0);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes flame{
    from{transform:scale(.8);}
    to{transform:scale(1.2);}
}

@keyframes titleShow{
    from{
        opacity:0;
        transform:scale(.5);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes balloonUp{
    from{
        bottom:-100px;
        transform:translateX(0);
    }
    to{
        bottom:110vh;
        transform:translateX(70px);
    }
}

@keyframes heartUp{
    from{
        bottom:-50px;
        opacity:0;
    }
    20%{opacity:1;}
    to{
        bottom:110vh;
        opacity:0;
        transform:translateX(70px);
    }
}

@keyframes confettiFall{
    from{
        transform:translateY(0) rotate(0);
        opacity:1;
    }
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

@keyframes pulse{
    50%{transform:scale(1.08);}
}


/* Mobile */

@media(max-width:600px){

    .title{
        font-size:38px;
    }

    .name{
        font-size:25px;
    }

    .cake-area{
        transform:scale(.85);
    }

}

</style>
</head>


<body>


<!-- GIFT SCREEN -->

<div id="start">

    <div class="intro">
        I have a special surprise for you... 💌
    </div>

    <div class="gift" onclick="openGift()">

        <div class="bow">🎀</div>

        <div class="gift-lid"></div>

        <div class="gift-box"></div>

    </div>

    <div class="intro">
        🎁 Tap the Gift 🎁
    </div>

</div>


<!-- SURPRISE SCREEN -->

<div id="surprise">

    <!-- Balloons -->

    <div class="balloon b1">🎈</div>
    <div class="balloon b2">🎈</div>
    <div class="balloon b3">🎈</div>
    <div class="balloon b4">🎈</div>


    <!-- Hearts -->

    <div class="heart h1">❤️</div>
    <div class="heart h2">💖</div>
    <div class="heart h3">💕</div>
    <div class="heart h4">❤️</div>


    <div class="content">

        <!-- CAKE -->

        <div class="cake-area">

            <div class="plate"></div>

            <div class="layer1"></div>

            <div class="layer2"></div>

            <div class="layer3"></div>

            <div class="cream">🍓</div>

            <div class="candle"></div>

            <div class="flame">🔥</div>

        </div>


        <h1 class="title">
            🎂 Happy Birthday 🎂
        </h1>

        <!-- NAME CHANGE HERE -->

        <div class="name">
            Dear Special One ❤️
        </div>

    </div>

</div>


<script>

function openGift(){

    const gift=document.querySelector(".gift");

    gift.classList.add("open");

    setTimeout(function(){

        document.getElementById("start").style.display="none";

        document.getElementById("surprise").style.display="flex";

        makeConfetti();

    },900);
}


function makeConfetti(){

    const symbols=[
        "🎉",
        "🎊",
        "✨",
        "💖",
        "❤️",
        "⭐",
        "🌸",
        "🥳"
    ];

    for(let i=0;i<100;i++){

        let c=document.createElement("div");

        c.className="confetti";

        c.innerHTML=
        symbols[Math.floor(Math.random()*symbols.length)];

        c.style.left=Math.random()*100+"vw";

        c.style.fontSize=
        (15+Math.random()*25)+"px";

        c.style.animationDuration=
        (2+Math.random()*3)+"s";

        c.style.animationDelay=
        Math.random()*2+"s";

        document.getElementById("surprise")
        .appendChild(c);

        setTimeout(function(){
            c.remove();
        },6000);

    }

}

</script>

</body>
</html>
