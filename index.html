<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎁 Surprise Gift</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

.container {
  text-align: center;
  position: relative;
  z-index: 5;
}

h1 {
  font-size: 30px;
  margin-bottom: 40px;
  animation: glow 2s infinite alternate;
}

.gift {
  width: 180px;
  height: 140px;
  position: relative;
  margin: auto;
  cursor: pointer;
  animation: bounce 1.5s infinite;
}

.box {
  position: absolute;
  bottom: 0;
  width: 180px;
  height: 110px;
  background: #ff3f81;
  border-radius: 8px;
  box-shadow: 0 15px 30px rgba(0,0,0,.2);
}

.box::after {
  content: "";
  position: absolute;
  left: 75px;
  width: 30px;
  height: 110px;
  background: #ffd700;
}

.lid {
  position: absolute;
  top: 10px;
  left: -10px;
  width: 200px;
  height: 45px;
  background: #ff1765;
  border-radius: 8px;
  z-index: 2;
  transition: .8s;
}

.lid::after {
  content: "";
  position: absolute;
  left: 85px;
  width: 30px;
  height: 45px;
  background: #ffd700;
}

.ribbon {
  position: absolute;
  width: 30px;
  height: 50px;
  background: #ffd700;
  top: -30px;
  left: 75px;
  border-radius: 50%;
  z-index: 3;
}

.open .lid {
  transform: translateY(-100px) rotate(-8deg);
}

button {
  margin-top: 35px;
  padding: 14px 28px;
  border: none;
  border-radius: 30px;
  background: white;
  color: #ff3f81;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,.2);
}

button:hover {
  transform: scale(1.08);
}

.message {
  display: none;
  margin-top: 30px;
  font-size: 24px;
  font-weight: bold;
  animation: appear 1s ease forwards;
}

/* PRANK SCREEN */

#prank {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.92);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 100;
  animation: prankAppear .5s ease;
}

.prank-hand {
  font-size: 120px;
  animation: shake .5s infinite;
}

#prank h2 {
  font-size: 42px;
  color: white;
  margin: 10px;
}

#prank p {
  font-size: 20px;
  color: white;
}

/* CONFETTI */

.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  top: -20px;
  animation: fall 3s linear forwards;
  pointer-events: none;
}

/* ANIMATIONS */

@keyframes bounce {
  0%,100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-15px);
  }
}

@keyframes glow {
  from {
    text-shadow: 0 0 5px white;
  }

  to {
    text-shadow: 0 0 20px white;
  }
}

@keyframes appear {
  from {
    opacity: 0;
    transform: scale(.5);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes prankAppear {
  from {
    opacity: 0;
    transform: scale(.5);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes shake {
  0%,100% {
    transform: rotate(-10deg);
  }

  50% {
    transform: rotate(10deg);
  }
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>✨ I Have a Surprise For You ✨</h1>

  <div class="gift" id="gift">
    <div class="ribbon"></div>
    <div class="lid"></div>
    <div class="box"></div>
  </div>

  <button onclick="openGift()">
    🎁 Open Your Gift
  </button>

  <div class="message" id="message">
    💖 Surprise! You are very special! 💖
    <br><br>
    🌸 Keep smiling and stay happy! 🌸
  </div>

</div>

<script>

function openGift() {

  const gift = document.getElementById("gift");
  const message = document.getElementById("message");

  gift.classList.add("open");

  /* Show prank */

  setTimeout(() => {

    const prank = document.createElement("div");

    prank.id = "prank";

    prank.innerHTML = `
      <div class="prank-hand">🖕</div>
      <h2>😂 GOTCHA!</h2>
      <p>Abhi asli surprise baaki hai...</p>
    `;

    document.body.appendChild(prank);

    /* Remove prank after 2.5 seconds */

    setTimeout(() => {

      prank.remove();

      message.style.display = "block";

    }, 2500);

  }, 800);


  /* Confetti */

  for (let i = 0; i < 100; i++) {

    const confetti = document.createElement("div");

    confetti.className = "confetti";

    confetti.style.left =
      Math.random() * 100 + "vw";

    confetti.style.background =
      [
        "#ff1744",
        "#ffd700",
        "#00e5ff",
        "#7c4dff",
        "#69f0ae"
      ][Math.floor(Math.random() * 5)];

    confetti.style.animationDelay =
      Math.random() * 1.5 + "s";

    document.body.appendChild(confetti);

    setTimeout(() => {
      confetti.remove();
    }, 4000);

  }

}

</script>

</body>
</html>
