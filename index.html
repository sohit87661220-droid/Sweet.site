<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎁 Surprise Gift</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

.container {
  text-align: center;
  z-index: 5;
}

h1 {
  font-size: 30px;
  animation: glow 2s infinite alternate;
}

.gift {
  width: 180px;
  height: 150px;
  position: relative;
  margin: 45px auto 0;
  cursor: pointer;
}

.box {
  position: absolute;
  bottom: 0;
  width: 180px;
  height: 110px;
  background: #ff3f81;
  border-radius: 8px;
  box-shadow: 0 15px 30px rgba(0,0,0,.25);
}

.box::after {
  content: "";
  position: absolute;
  left: 75px;
  width: 30px;
  height: 110px;
  background: #ffd700;
}

.lid {
  position: absolute;
  top: 20px;
  left: -10px;
  width: 200px;
  height: 45px;
  background: #ff1765;
  border-radius: 8px;
  z-index: 4;
  transition: 0.8s ease;
}

.lid::after {
  content: "";
  position: absolute;
  left: 85px;
  width: 30px;
  height: 45px;
  background: #ffd700;
}

.ribbon {
  position: absolute;
  width: 30px;
  height: 50px;
  background: #ffd700;
  top: -15px;
  left: 75px;
  border-radius: 50%;
  z-index: 5;
}

.open .lid {
  transform: translateY(-110px) rotate(-10deg);
}

button {
  margin-top: 35px;
  padding: 14px 30px;
  border: none;
  border-radius: 30px;
  background: white;
  color: #ff3f81;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,.2);
}

button:active {
  transform: scale(.95);
}

/* GORILLA */

.gorilla {
  position: fixed;
  left: 50%;
  bottom: 25%;
  transform: translateX(-50%);
  font-size: 130px;
  z-index: 50;
  animation: jump 1.4s ease-out forwards;
}

@keyframes jump {
  0% {
    transform: translate(-50%, 180px) scale(.2);
    opacity: 0;
  }

  35% {
    transform: translate(-50%, -100px) scale(1.3);
    opacity: 1;
  }

  60% {
    transform: translate(-50%, 20px) scale(1);
  }

  75% {
    transform: translate(-50%, -30px) scale(1.1);
  }

  100% {
    transform: translate(-50%, 0) scale(1);
  }
}

.gorilla-text {
  position: fixed;
  left: 50%;
  top: 62%;
  transform: translateX(-50%);
  z-index: 51;
  font-size: 35px;
  font-weight: bold;
  animation: textPop .6s .8s both;
}

@keyframes textPop {
  from {
    opacity: 0;
    transform: translateX(-50%) scale(.3);
  }

  to {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }
}

/* MESSAGE */

.message {
  display: none;
  margin-top: 30px;
  font-size: 24px;
  font-weight: bold;
  animation: appear 1s ease;
}

/* CONFETTI */

.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  top: -20px;
  z-index: 100;
  animation: fall 3s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}

@keyframes appear {
  from {
    opacity: 0;
    transform: scale(.4);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes glow {
  from {
    text-shadow: 0 0 5px white;
  }

  to {
    text-shadow: 0 0 20px white;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>✨ I Have a Surprise For You ✨</h1>

  <div class="gift" id="gift">

    <div class="ribbon"></div>

    <div class="lid"></div>

    <div class="box"></div>

  </div>

  <button onclick="openGift()">
    🎁 Open Your Gift
  </button>

  <div class="message" id="message">
    💖 Surprise! You are very special! 💖
    <br><br>
    🌸 Keep smiling and stay happy! 🌸
  </div>

</div>

<script>

function openGift() {

  const gift = document.getElementById("gift");
  const message = document.getElementById("message");

  gift.classList.add("open");

  setTimeout(function() {

    gorilla.className = "gorilla";
    gorilla.innerHTML = "🦍";

    document.body.appendChild(gorilla);
